# Manual symbol export: dispatch with a ticker, download the HTML snapshot
# from the run's Artifacts. No server runs; the exporter's warm pass is the
# only network code (all of it inside src/market.py).
name: Export analysis

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker to export (e.g. AAPL)"
        required: true
      range:
        description: "Chart range: years (e.g. 5) or 'ytd'; empty = default"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMBOL: ${{ inputs.symbol }}
      RANGE: ${{ inputs.range }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # the exporter watchlists + warms the symbol itself (cold-start
      # capable); a bad ticker makes the run exit red
      - name: Export HTML snapshot
        run: |
          symbol="${SYMBOL^^}"
          args=("$symbol" -o "export/${symbol}.html")
          [ -n "$RANGE" ] && args+=(--range "$RANGE")
          python utils/export_html_analysis.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.symbol }}-analysis
          path: export/*.html
          if-no-files-found: error
