# Export analysis snapshots: dispatch with symbols (comma-separated,
# default = DEFAULT_SYMBOLS below) or let the daily schedule run the whole
# list. HTML snapshots land in the run's Artifacts and on Pages
# (index.html lists every report). No server runs; the exporter's warm
# pass is the only network code (all of it inside src/market.py).
name: Export analysis

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated tickers (e.g. 'VOO, NVDA'); empty = default list"
        required: false
        default: ""
      range:
        description: "Chart range: years (e.g. 5) or 'ytd'; empty = default"
        required: false
        default: ""
  schedule:
    - cron: "0 0 * * *"   # daily 00:00 UTC

permissions:
  contents: write  # push gh-pages (Pages serve) in addition to the artifact

# scheduled runs have no dispatch inputs — the default list lives here
env:
  DEFAULT_SYMBOLS: "VOO,VTI,NVDA,ZURVY,SNPS,HDEU.L"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYMBOLS: ${{ inputs.symbols || env.DEFAULT_SYMBOLS }}
      RANGE: ${{ inputs.range }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # the exporter watchlists + warms each symbol itself (cold-start
      # capable); a bad ticker makes the run exit red, good ones before
      # it still export
      - name: Export HTML snapshots
        run: |
          mkdir -p export
          range_args=()
          [ -n "$RANGE" ] && range_args+=(--range "$RANGE")
          ok=0
          for symbol in ${SYMBOLS//,/ }; do
            [ -n "$symbol" ] || continue
            symbol="${symbol^^}"
            echo "::group::Export ${symbol}"
            if python utils/export_html_analysis.py "$symbol" \
                -o "export/${symbol}.html" "${range_args[@]}"; then
              ok=$((ok+1))
            else
              echo "EXPORT_FAILED=${symbol}" >> "$GITHUB_ENV"
            fi
            echo "::endgroup::"
          done
          [ "$ok" -gt 0 ] || { echo "no symbol exported"; exit 1; }
          test -z "$EXPORT_FAILED" || { echo "failed: $EXPORT_FAILED"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: analysis
          path: export/*.html
          if-no-files-found: error

      # also publish to Pages: https://<user>.github.io/<repo>/ — index.html
      # lists every exported snapshot; past exports are carried forward
      - name: Prepare Pages site (carry forward + index)
        run: |
          mkdir -p pages
          # pull existing gh-pages files (no-op on the first run)
          if git fetch --no-tags --depth 1 origin gh-pages; then
            git --work-tree=pages checkout FETCH_HEAD -- .
          fi
          cp export/*.html pages/
          python - <<'EOF'
          import pathlib
          pages = pathlib.Path("pages")
          reports = sorted(
              p for p in pages.glob("*.html")
              if p.name != "index.html"
          )
          items = "\n".join(
              f'        <li><a href="{p.name}">{p.stem}</a></li>'
              for p in reports
          ) or "        <li>(no reports yet)</li>"
          pages.joinpath("index.html").write_text(f"""<!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Longfund — exported analyses</title></head>
          <body style="font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; line-height: 1.6">
            <h1>Longfund — exported analyses</h1>
            <ul>
          {items}
            </ul>
          </body></html>""")
          EOF

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
          keep_files: false
