# Manual symbol export: dispatch with a ticker, download the HTML snapshot
# from the run's Artifacts. No server runs; the exporter's warm pass is the
# only network code (all of it inside src/market.py).
name: Export analysis

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker to export (e.g. AAPL)"
        required: true
      range:
        description: "Chart range: years (e.g. 5) or 'ytd'; empty = default"
        required: false
        default: ""

permissions:
  contents: write  # push gh-pages (Pages serve) in addition to the artifact

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMBOL: ${{ inputs.symbol }}
      RANGE: ${{ inputs.range }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # the exporter watchlists + warms the symbol itself (cold-start
      # capable); a bad ticker makes the run exit red
      - name: Export HTML snapshot
        run: |
          symbol="${SYMBOL^^}"
          args=("$symbol" -o "export/${symbol}.html")
          [ -n "$RANGE" ] && args+=(--range "$RANGE")
          python utils/export_html_analysis.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.symbol }}-analysis
          path: export/*.html
          if-no-files-found: error

      # also publish to Pages: https://<user>.github.io/<repo>/ — index.html
      # lists every exported snapshot; past exports are carried forward
      - name: Prepare Pages site (carry forward + index)
        run: |
          mkdir -p pages
          # pull existing gh-pages files (no-op on the first run)
          if git fetch --no-tags --depth 1 origin gh-pages; then
            git --work-tree=pages checkout FETCH_HEAD -- .
          fi
          cp export/*.html pages/
          python - <<'EOF'
          import pathlib
          pages = pathlib.Path("pages")
          reports = sorted(
              p for p in pages.glob("*.html")
              if p.name != "index.html"
          )
          items = "\n".join(
              f'        <li><a href="{p.name}">{p.stem}</a></li>'
              for p in reports
          ) or "        <li>(no reports yet)</li>"
          pages.joinpath("index.html").write_text(f"""<!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Longfund — exported analyses</title></head>
          <body style="font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; line-height: 1.6">
            <h1>Longfund — exported analyses</h1>
            <ul>
          {items}
            </ul>
          </body></html>""")
          EOF

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
          keep_files: false
